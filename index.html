
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07172b">
  <title>地球の窓 | World Live Journey</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #07172b;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", sans-serif;
    }

    header {
      padding: 25px 20px 18px;
      text-align: center;
    }

    h1 { margin: 0; font-size: 28px; }

    .subtitle {
      color: #a8bfd7;
      font-size: 13px;
      margin-top: 8px;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 12px 18px 40px;
    }

    .category {
      margin: 22px 0 10px;
      color: #a8bfd7;
      font-size: 14px;
      font-weight: bold;
    }

    .channel-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .channel {
      border: 1px solid #35536f;
      border-radius: 12px;
      background: #142941;
      color: #e0ecf5;
      padding: 14px 10px;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      line-height: 1.5;
    }

    .channel.active {
      background: #38b6a4;
      color: #06232c;
      border-color: #38b6a4;
      font-weight: bold;
    }

    .card {
      margin-top: 26px;
      background: #142941;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px #0005;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .preview {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #063e59, #087c8c);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    .preview .emoji { font-size: 60px; }
    .preview .message {
      font-size: 16px;
      font-weight: bold;
    }

    .content { padding: 22px; }

    h2 { margin: 0 0 10px; font-size: 21px; }

    p {
      color: #b8c9d9;
      font-size: 14px;
      line-height: 1.6;
    }

    .button {
      display: block;
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: #38b6a4;
      color: #06232c;
      text-decoration: none;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #92a9bd;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🌍 地球の窓</h1>
    <div class="subtitle">World Live Journey</div>
  </header>

  <main>

    <div class="category">🌌 空と宇宙</div>
    <div class="channel-list">
      <button class="channel active" data-camera="aurora"
              onclick="showCamera('aurora')">
        CH 01｜🌌 オーロラ
      </button>
      <button class="channel" data-camera="space"
              onclick="showCamera('space')">
        CH 02｜🚀 宇宙から地球
      </button>
    </div>

    <div class="category">🐠 水中の世界</div>
    <div class="channel-list">
      <button class="channel" data-camera="aquarium"
              onclick="showCamera('aquarium')">
        CH 03｜🐋 ジョージア水族館
      </button>
    </div>

    <div class="category">🐘 野生動物・サファリ</div>
    <div class="channel-list">
      <button class="channel" data-camera="kenya"
              onclick="showCamera('kenya')">
        CH 04｜🐒 ケニア水飲み場
      </button>
      <button class="channel" data-camera="africam"
              onclick="showCamera('africam')">
        CH 05｜🦁 Africam
      </button>
    </div>

    <div class="category">🦍 世界の動物園</div>
    <div class="channel-list">
      <button class="channel" data-camera="sandiego"
              onclick="showCamera('sandiego')">
        CH 06｜🐘 サンディエゴ
      </button>
      <button class="channel" data-camera="houston"
              onclick="showCamera('houston')">
        CH 07｜🦍 ヒューストン
      </button>
    </div>

    <div class="card" id="playerCard">

      <div class="video" id="videoContainer">
        <iframe
          id="livePlayer"
          src="https://www.youtube.com/embed/O52zDyxg5QI"
          title="Live camera"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <div class="preview" id="preview">
        <div class="emoji" id="previewEmoji">🌍</div>
        <div class="message" id="previewMessage">
          世界のライブカメラへ出発！
        </div>
      </div>

      <div class="content">
        <h2 id="cameraTitle">🌌 オーロラ｜アラスカ</h2>
        <p id="cameraDescription">
          静かな夜空に、オーロラが現れるかも。
        </p>
        <p id="cameraCredit">
          配信：Explore.org / ExploreZenDen
        </p>

        <a class="button"
           id="cameraLink"
           href="https://www.youtube.com/watch?v=O52zDyxg5QI"
           target="_blank"
           rel="noopener noreferrer">
          ▶ YouTubeでライブを見る
        </a>
      </div>
    </div>

  </main>

  <footer>世界中の「今」を旅しよう！ 🌏</footer>

  <script>
    const cameras = {
      aurora: {
        id: "O52zDyxg5QI",
        title: "🌌 オーロラ｜アラスカ",
        description: "静かな夜空に、オーロラが現れるかも。",
        credit: "配信：Explore.org / ExploreZenDen",
        url: "https://www.youtube.com/watch?v=O52zDyxg5QI",
        button: "▶ YouTubeでライブを見る",
        type: "youtube"
      },

      space: {
        id: "tj4knR4r1UU",
        title: "🚀 宇宙から見る地球｜ISS",
        description: "地球の青い海や雲を、宇宙から眺めよう。",
        credit: "配信：afarTV（NASA公式ではありません。映像が常にリアルタイムとは限りません）",
        url: "https://www.youtube.com/watch?v=tj4knR4r1UU",
        button: "▶ YouTubeでライブを見る",
        type: "youtube"
      },

      aquarium: {
        title: "🐋 ジョージア水族館｜巨大水槽",
        description: "アメリカ・アトランタの巨大水槽。ジンベエザメやエイたちの世界へ！",
        credit: "配信：Georgia Aquarium",
        url: "https://www.georgiaaquarium.org/webcam/ocean-voyager/",
        button: "🐠 水族館のライブを見る",
        emoji: "🐋🐠",
        type: "external"
      },

      kenya: {
        title: "🐒 ケニア｜野生動物の水飲み場",
        description: "アフリカの野生動物たちが集まる水飲み場。今日は誰が現れるかな？",
        credit: "配信：Explore.org",
        url: "https://explore.org/livecams/african-wildlife/african-watering-hole-animal-camera",
        button: "🐘 サファリのライブを見る",
        emoji: "🐒🐘",
        type: "external"
      },

      africam: {
        title: "🦁 Africam｜アフリカの野生動物",
        description: "アフリカ各地の野生動物を観察しよう。",
        credit: "配信：Africam",
        url: "https://www.youtube.com/watch?v=PsJplltf9n8",
        button: "🦁 Africamのライブを見る",
        emoji: "🦁🐘",
        type: "external"
      },

      sandiego: {
        title: "🐘 サンディエゴ・サファリパーク",
        description: "アメリカのサファリパークでゾウなどの動物たちを観察しよう。",
        credit: "配信：San Diego Zoo Wildlife Alliance",
        url: "https://sdzsafaripark.org/live-cameras",
        button: "🐘 サファリパークのライブを見る",
        emoji: "🐘🦒",
        type: "external"
      },

      houston: {
        title: "🦍 ヒューストン動物園",
        description: "ゴリラやカワウソなど、動物たちの様子を見に行こう。",
        credit: "配信：Houston Zoo",
        url: "https://www.houstonzoo.org/explore/webcams/",
        button: "🦍 動物園のライブを見る",
        emoji: "🦍🦦",
        type: "external"
      }
    };

    function showCamera(name) {
      const camera = cameras[name];
      if (!camera) return;

      const video = document.getElementById("videoContainer");
      const player = document.getElementById("livePlayer");
      const preview = document.getElementById("preview");

      if (camera.type === "youtube") {
        video.style.display = "block";
        preview.style.display = "none";
        player.src = "https://www.youtube.com/embed/" + camera.id;
      } else {
        player.src = "about:blank";
        video.style.display = "none";
        preview.style.display = "flex";

        document.getElementById("previewEmoji").textContent =
          camera.emoji || "🌍";

        document.getElementById("previewMessage").textContent =
          "ライブカメラを見に行こう！";
      }

      document.getElementById("cameraTitle").textContent = camera.title;
      document.getElementById("cameraDescription").textContent =
        camera.description;
      document.getElementById("cameraCredit").textContent = camera.credit;

      const link = document.getElementById("cameraLink");
      link.href = camera.url;
      link.textContent = camera.button;

      document.querySelectorAll(".channel").forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.camera === name
        );
      });

      document.getElementById("playerCard").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  </script>
</body>
</html>
