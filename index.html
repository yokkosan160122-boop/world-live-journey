
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07172b">
  <title>地球の窓 | World Live Journey</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #07172b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", sans-serif;
    }

    header {
      padding: 25px 20px 18px;
      text-align: center;
    }

    h1 { margin: 0; font-size: 28px; }

    .subtitle {
      color: #a8bfd7;
      font-size: 13px;
      margin-top: 8px;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 12px 18px 40px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab {
      flex: 1 1 145px;
      padding: 13px 8px;
      border: 1px solid #35536f;
      border-radius: 12px;
      background: #142941;
      color: #c8d8e7;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #38b6a4;
      color: #06232c;
      border-color: #38b6a4;
    }

    .card {
      background: #142941;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px #0005;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .aquarium-preview {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #063e59, #087c8c);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }

    .aquarium-preview .emoji {
      font-size: 64px;
    }

    .aquarium-preview .message {
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
    }

    .content { padding: 22px; }

    h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    p {
      color: #b8c9d9;
      font-size: 14px;
      line-height: 1.6;
    }

    .button {
      display: block;
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: #38b6a4;
      color: #06232c;
      text-decoration: none;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #92a9bd;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🌍 地球の窓</h1>
    <div class="subtitle">World Live Journey</div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" id="auroraTab"
              onclick="showCamera('aurora')">
        🌌 オーロラ
      </button>

      <button class="tab" id="spaceTab"
              onclick="showCamera('space')">
        🚀 宇宙から地球
      </button>

      <button class="tab" id="aquariumTab"
              onclick="showCamera('aquarium')">
        🐋 水族館
      </button>
    </div>

    <div class="card">
      <div class="video" id="videoContainer">
        <iframe
          id="livePlayer"
          src="https://www.youtube.com/embed/O52zDyxg5QI"
          title="Live camera"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen>
        </iframe>
      </div>

      <div class="aquarium-preview" id="aquariumPreview">
        <div class="emoji">🐋 🐠 🦈</div>
        <div class="message">アメリカの巨大水槽へ出発！</div>
      </div>

      <div class="content">
        <h2 id="cameraTitle">🌌 オーロラ｜アラスカ</h2>

        <p id="cameraDescription">
          世界の今を見に行こう。静かな夜空に、オーロラが現れるかも。
        </p>

        <p id="cameraCredit">
          配信：Explore.org / ExploreZenDen
        </p>

        <a class="button"
           id="cameraLink"
           href="https://www.youtube.com/watch?v=O52zDyxg5QI"
           target="_blank"
           rel="noopener noreferrer">
          ▶ YouTubeでライブを見る
        </a>
      </div>
    </div>
  </main>

  <footer>
    世界中の「今」を旅しよう！ 🌏
  </footer>

  <script>
    const cameras = {
      aurora: {
        id: "O52zDyxg5QI",
        title: "🌌 オーロラ｜アラスカ",
        description: "世界の今を見に行こう。静かな夜空に、オーロラが現れるかも。",
        credit: "配信：Explore.org / ExploreZenDen",
        url: "https://www.youtube.com/watch?v=O52zDyxg5QI",
        button: "▶ YouTubeでライブを見る",
        type: "youtube"
      },

      space: {
        id: "tj4knR4r1UU",
        title: "🚀 宇宙から見る地球｜ISS",
        description: "地球の青い海や雲を、宇宙から眺めよう。ISS関連のライブ配信を楽しめます。",
        credit: "配信：afarTV（NASA公式チャンネルではありません。映像が常にリアルタイムとは限りません）",
        url: "https://www.youtube.com/watch?v=tj4knR4r1UU",
        button: "▶ YouTubeでライブを見る",
        type: "youtube"
      },

      aquarium: {
        title: "🐋 ジョージア水族館｜巨大水槽",
        description: "アメリカ・アトランタの巨大水槽。ジンベエザメやエイなどが泳ぐ世界を楽しもう！",
        credit: "配信：Georgia Aquarium（公式ライブカメラ）",
        url: "https://www.georgiaaquarium.org/webcam/ocean-voyager/",
        button: "🐠 水族館のライブ映像を見る",
        type: "external"
      }
    };

    function showCamera(name) {
      const camera = cameras[name];
      if (!camera) return;

      const video = document.getElementById("videoContainer");
      const player = document.getElementById("livePlayer");
      const preview = document.getElementById("aquariumPreview");

      if (camera.type === "youtube") {
        video.style.display = "block";
        preview.style.display = "none";
        player.src = "https://www.youtube.com/embed/" + camera.id;
      } else {
        player.src = "about:blank";
        video.style.display = "none";
        preview.style.display = "flex";
      }

      document.getElementById("cameraTitle").textContent = camera.title;
      document.getElementById("cameraDescription").textContent = camera.description;
      document.getElementById("cameraCredit").textContent = camera.credit;

      const link = document.getElementById("cameraLink");
      link.href = camera.url;
      link.textContent = camera.button;

      document.getElementById("auroraTab").classList.toggle("active", name === "aurora");
      document.getElementById("spaceTab").classList.toggle("active", name === "space");
      document.getElementById("aquariumTab").classList.toggle("active", name === "aquarium");
    }
  </script>
</body>
</html>
