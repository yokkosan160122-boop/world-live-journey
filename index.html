
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07172b">
  <title>地球の窓 | World Live Journey</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #07172b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", sans-serif;
    }
    header {
      padding: 25px 20px;
      text-align: center;
    }
    h1 { margin: 0; font-size: 28px; }
    .subtitle {
      color: #a8bfd7;
      font-size: 13px;
      margin-top: 8px;
    }
    main {
      max-width: 650px;
      margin: auto;
      padding: 12px 18px 40px;
    }
    .card {
      background: #142941;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px #0005;
    }
    .sky {
      height: 210px;
      background: linear-gradient(
        160deg, #102a49, #145b57, #08192d
      );
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 76px;
    }
    .content { padding: 22px; }
    h2 { margin: 0 0 10px; font-size: 21px; }
    p { color: #b8c9d9; font-size: 14px; }
    .button {
      display: block;
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: #38b6a4;
      color: #06232c;
      text-decoration: none;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 35px 15px;
      color: #92a9bd;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌍 地球の窓</h1>
    <div class="subtitle">World Live Journey</div>
  </header>

  <main>
    <div class="card">
      <div class="sky">🌌</div>
      <div class="content">
        <h2>🌌 オーロラ｜アラスカ</h2>
        <p>世界の今を見に行こう。</p>
        <p>静かな夜空に、オーロラが現れるかも。</p>
        <a class="button"
           href="https://explore.org/livecams/currently-live/aurora-cam"
           target="_blank"
           rel="noopener noreferrer">
          ▶ ライブカメラを開く
        </a>
      </div>
    </div>
  </main>

  <footer>
    世界中の「今」を旅しよう！ 🌏
  </footer>
</body>
</html>
